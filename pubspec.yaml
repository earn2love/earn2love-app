name: earn2love_app
description: Earn2Love MVP
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.1.3

  # Media + Local storage
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # App icon generator
  flutter_launcher_icons: ^0.14.4  # :contentReference[oaicite:0]{index=0}

flutter:
  uses-material-design: true

  # Put your icon file here:
  # assets/icon/app_icon.png
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true

  # For Android 13+ monochrome icon (optional but nice)
  image_path: "assets/icon/app_icon.png"

  # If you want true Adaptive Icons on Android, use these instead:
  # adaptive_icon_background: "#1F1B2E"
  # adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  # adaptive_icon_monochrome: "assets/icon/app_icon_mono.png"
