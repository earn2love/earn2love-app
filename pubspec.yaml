name: earn2love_app
description: Earn2Love MVP
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.1.3
  crypto: ^3.0.3
  country_picker: ^2.0.27
  video_player: ^2.9.2
  just_audio: ^0.9.46
  path_provider: ^2.1.5
  record: 5.2.1
  visibility_detector: ^0.4.0+2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  cloud_functions: ^5.6.2
  cached_network_image: ^3.4.1
  agora_rtc_engine: ^6.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  record_platform_interface: 1.2.0
  record_linux: 0.7.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/earn2love_icon.png"
